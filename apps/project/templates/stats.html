<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Statistics</title>
    <!-- Include Vue.js and Axios here -->
    <script src="https://unpkg.com/vue@next"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
    <!-- Link to your stats.js file -->
    <script defer src="path_to_your_js/stats.js"></script>
</head>
<body>
    <div id="stats-app">
        <h1>User Statistics</h1>
        <div v-if="loading">Loading statistics...</div>
        <div v-if="error" class="error">{{ error }}</div>
        <table v-if="!loading && !error">
            <thead>
                <tr>
                    <th>Species Name</th>
                    <th>Number Seen</th>
                </tr>
            </thead>
            <tbody>
                <tr v-for="stat in stats" :key="stat.species_name">
                    <td>{{ stat.species_name }}</td>
                    <td>{{ stat.number_seen }}</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
