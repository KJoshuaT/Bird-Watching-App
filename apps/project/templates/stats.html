[[extend 'layout.html']]

<div class="section" id="app" v-cloak>
    <div class="field">
        <label class="label">Search Species</label>
        <div class="control">
            <input class="input" type="text" v-model="searchQuery" placeholder="Enter species name">
        </div>
    </div>
    <table class="table is-striped is-hoverable is-fullwidth">
        <thead>
            <tr>
                <th>Species</th>
                <th>Count</th>
            </tr>
        </thead>
        <tbody>
            <tr v-for="(value, key) in filteredTotals" :key="key">
                <td>{{ key }}</td>
                <td>{{ value }}</td>
            </tr>
        </tbody>
    </table>
</div>

[[block page_scripts]]
<!-- Loads the index-specific js for Vue -->
<script>
    let load_data_url = "[[=XML(load_data_url)]]";
</script>

<script src="js/stats.js"></script>
[[end]]
